spring:

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/boaz?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:0000}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: always
      encoding: UTF-8

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: false

  jackson:
    property-naming-strategy: SNAKE_CASE

  cloud:
    aws:
      s3:
        recruitment-bucket: ${S3_RECRUITMENT_BUCKET_NAME}
        archiving-bucket: ${S3_ARCHIVING_BUCKET_NAME}
      region:
        static: ap-northeast-2
      credentials:
        access-key: ${AWS_ACCESS_KEY:}
        secret-key: ${AWS_SECRET_KEY:}

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:kakao-not-configured}
            client-secret: ${KAKAO_CLIENT_SECRET:kakao-not-configured}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile
          naver:
            client-id: ${NAVER_CLIENT_ID:naver-not-configured}
            client-secret: ${NAVER_CLIENT_SECRET:naver-not-configured}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            scope:
              - name
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  api-docs:
    path: /api-docs

swagger:
  server-url: "http://localhost:8080"

cors:
  allowed-origins: "http://localhost:3000,https://boazwebv1.vercel.app"

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 900000     # 15분 (ms)
  refresh-token-expiration: 604800000 # 7일 (ms)

cookie:
  same-site: Lax
  secure: false
  domain:

oauth2:
  redirect-uri: http://localhost:3000/auth/callback
  failure-redirect-uri: http://localhost:3000/login?error=true 