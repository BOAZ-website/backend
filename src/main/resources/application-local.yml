spring:

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/boaz?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: always
      encoding: UTF-8

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: false

  jackson:
    property-naming-strategy: SNAKE_CASE

  cloud:
    aws:
      s3:
        bucket: ${S3_BUCKET_NAME}
      region:
        static: ap-northeast-2
      credentials:
        access-key: ${AWS_ACCESS_KEY:}
        secret-key: ${AWS_SECRET_KEY:}

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  api-docs:
    path: /api-docs

swagger:
  server-url: "http://localhost:8080"

admin:
  api-key: ${ADMIN_API_KEY}

cors:
  allowed-origins: "http://localhost:3000,https://boazwebv1.vercel.app"

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 900000     # 15분 (ms)
  refresh-token-expiration: 604800000 # 7일 (ms)

cookie:
  same-site: Lax
  secure: false
  domain: 