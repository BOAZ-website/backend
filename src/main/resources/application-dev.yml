spring:

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/boaz?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: never
      encoding: UTF-8

  jpa:
    defer-datasource-initialization: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: false

  jackson:
    property-naming-strategy: SNAKE_CASE

  cloud:
    aws:
      s3:
        bucket: ${S3_BUCKET_NAME}
      region:
        static: ap-northeast-2

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  api-docs:
    path: /api-docs

swagger:
  server-url: "https://dev.bigdataboaz.com"

admin:
  api-key: ${ADMIN_API_KEY}

cors:
  allowed-origins: "http://localhost:5173,http://localhost:5174,https://boazwebv1.vercel.app,https://dev.bigdataboaz.com"

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 900000     # 15분 (ms)
  refresh-token-expiration: 604800000 # 7일 (ms)

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

cookie:
  same-site: Strict
  secure: true
  domain: dev.bigdataboaz.com 
