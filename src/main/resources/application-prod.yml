spring:

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: never
      encoding: UTF-8

  jpa:
    defer-datasource-initialization: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  jackson:
    property-naming-strategy: SNAKE_CASE

  cloud:
    aws:
      s3:
        recruitment-bucket: ${S3_RECRUITMENT_BUCKET_NAME}
        archiving-bucket: ${S3_ARCHIVING_BUCKET_NAME}
      region:
        static: ap-northeast-2

server:
  port: 8080
  forward-headers-strategy: native

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  api-docs:
    path: /api-docs

swagger:
  server-url: "https://api.bigdataboaz.com"

admin:
  api-key: ${ADMIN_API_KEY}

cors:
  allowed-origins: "https://www.bigdataboaz.com,https://prod-www.bigdataboaz.com"

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 900000     # 15분 (ms)
  refresh-token-expiration: 604800000 # 7일 (ms)

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

cookie:
  same-site: Strict
  secure: true
  domain: bigdataboaz.com 

logging:
  level:
    root: INFO
    org.springframework: WARN
    org.hibernate: WARN
    com.boaz: INFO
  file:
    name: /var/log/boaz/application.log