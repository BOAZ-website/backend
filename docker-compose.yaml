version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: boaz-mysql
    restart: always
    environment:
      MYSQL_DATABASE: boaz
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-0000}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: