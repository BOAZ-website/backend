name: CI

on:
  push:
    branches: [ dev , main]
  pull_request:
    branches: [ dev , main]
  workflow_dispatch:

jobs:
  build:
    name: Gradle Build
    runs-on: ubuntu-latest
 
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
 
      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
 
      - name: Gradle 캐시 설정
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-
 
      - name: Gradle 실행 권한 부여
        run: chmod +x gradlew
 
      - name: 테스트 실행
        run: ./gradlew test

      - name: JAR 빌드
        run: ./gradlew bootJar -x test
 
      - name: 빌드된 JAR 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/backend-0.0.1-SNAPSHOT.jar
          retention-days: 1
 
