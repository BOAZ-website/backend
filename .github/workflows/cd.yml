name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [dev, main]

  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy to EC2 via CodeDeploy
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Gradle 실행 권한 부여
        run: chmod +x gradlew

      - name: JAR 빌드
        run: ./gradlew bootJar -x test

      - name: AWS 자격증명 설정 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::156312218841:role/role-prod-github-actions
          aws-region: ap-northeast-2

      - name: 배포 번들 생성
        run: |
          mkdir -p deploy-bundle/scripts deploy-bundle/systemd
          cp build/libs/backend-0.0.1-SNAPSHOT.jar deploy-bundle/app.jar
          cp appspec.yml deploy-bundle/
          cp scripts/* deploy-bundle/scripts/
          cp systemd/* deploy-bundle/systemd/
          cd deploy-bundle && zip -r ../deploy-bundle.zip .

      - name: S3에 번들 업로드
        run: |
          aws s3 cp deploy-bundle.zip \
            s3://boaz-codedeploy-bucket/deploy-bundle-${{ github.sha }}.zip

      - name: CodeDeploy 배포 트리거
        run: |
          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name boaz-backend \
            --deployment-group-name codedeploy-prod \
            --s3-location bucket=boaz-codedeploy-bucket,key=deploy-bundle-${{ github.sha }}.zip,bundleType=zip \
            --deployment-config-name CodeDeployDefault.AllAtOnce \
            --description "Deploy ${{ github.sha }}" \
            --query 'deploymentId' \
            --output text)
          echo "DEPLOYMENT_ID=$DEPLOYMENT_ID" >> $GITHUB_ENV
          echo "배포 시작: $DEPLOYMENT_ID"

      - name: 배포 완료 대기
        run: |
          aws deploy wait deployment-successful \
            --deployment-id $DEPLOYMENT_ID
          echo "✅ 배포 성공: $DEPLOYMENT_ID"
